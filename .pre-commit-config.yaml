# Hooks locaux "shift-left" : bloquent le commit AVANT qu'il ne quitte le poste.
# Chaque depot est epingle par SHA de commit (un tag Git est modifiable, un SHA ne l'est pas).
# Installation : pip install pre-commit && pre-commit install
# Objectif de duree : < 10 s par commit (les scans lourds restent en CI).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: detect-private-key        # cles privees PEM/SSH
      - id: check-added-large-files   # gros binaires / dumps
        exclude: ^docs/export/        # livrables PDF/Word generes volontairement
      - id: check-yaml
        args: [--unsafe]              # Jenkins/K8s : syntaxe seulement

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks                  # secrets dans les fichiers indexes

  - repo: https://github.com/PyCQA/bandit
    rev: 8fd258abbac759d62863779f946d6a88e8eabb0f  # frozen: 1.8.0
    hooks:
      - id: bandit                    # SAST Python, severite >= MEDIUM
        args: [-ll, -q]
        files: ^app/facturation/