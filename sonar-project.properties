# Analyse SonarQube (projectKey fourni par le Jenkinsfile : un projet par branche analysee)
sonar.projectName=facturation-api
sonar.sources=app/facturation
sonar.tests=app/tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# Centralisation : les resultats des autres scanners sont importes dans SonarQube
sonar.python.bandit.reportPaths=reports/bandit.json
sonar.sarifReportPaths=reports/semgrep.sarif,reports/gitleaks.sarif
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml